# JVM for the Gradle daemon. The runner has 16 GB; AGP + Compose compiler are
# comfortable at 3 GB.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only — there is no support-library code anywhere in this project.
android.useAndroidX=true
# Each module's R class holds only its own resources.
android.nonTransitiveRClass=true

kotlin.code.style=official
